name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/bdjoseluis/psicologia-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # permite push a GHCR con GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

      - name: Deploy en VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u bdjoseluis --password-stdin
            docker pull ghcr.io/bdjoseluis/psicologia-frontend:latest
            docker stop psico 2>/dev/null || true
            docker rm   psico 2>/dev/null || true
            docker run -d \
              --name psico \
              --restart unless-stopped \
              --network traefik-net \
              -l "traefik.enable=true" \
              -l "traefik.http.routers.psico.rule=Host(\`devesan.b-dev.es\`)" \
              -l "traefik.http.routers.psico.entrypoints=websecure" \
              -l "traefik.http.routers.psico.tls=true" \
              -l "traefik.http.routers.psico.tls.certresolver=letsencrypt" \
              -l "traefik.http.services.psico.loadbalancer.server.port=80" \
              ghcr.io/bdjoseluis/psicologia-frontend:latest
            docker network connect devesan-net psico 2>/dev/null || true
            docker image prune -f
