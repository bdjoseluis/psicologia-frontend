<!-- Navbar DEVESAN -->
<nav class="main-navbar" [class.scrolled]="scrolled">
  <div class="navbar-content">
    <a class="navbar-brand" routerLink="/home">DEVESAN</a>

    <!-- Links desktop -->
    <ul class="navbar-links">
      <li><a (click)="scrollTo('inicio')" [routerLink]="['/home']" [fragment]="'inicio'">Inicio</a></li>
      <li><a (click)="scrollTo('servicios')" [routerLink]="['/home']" [fragment]="'servicios'">Servicios</a></li>
      <li><a (click)="scrollTo('sobre')" [routerLink]="['/home']" [fragment]="'sobre'">Sobre</a></li>
      <li><a (click)="scrollTo('contacto')" [routerLink]="['/home']" [fragment]="'contacto'">Contacto</a></li>
      <li><a (click)="scrollTo('horarios')" [routerLink]="['/home']" [fragment]="'horarios'">Horarios</a></li>
    </ul>

    <!-- Auth CTA -->
    <div class="navbar-auth">
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" class="nav-btn nav-btn-ghost">Iniciar sesión</a>
        <a routerLink="/registro" class="nav-btn nav-btn-gold">Regístrate</a>
      </ng-container>
      <ng-container *ngIf="isLoggedIn && isPatient">
        <a routerLink="/mi-area" class="nav-btn nav-btn-ghost">Mi área</a>
        <a routerLink="/mi-area" [queryParams]="{tab:'reservar'}" class="nav-btn nav-btn-gold">Reservar cita</a>
      </ng-container>
      <ng-container *ngIf="isLoggedIn && isAdmin">
        <a routerLink="/admin" class="nav-btn nav-btn-gold">Panel admin</a>
      </ng-container>
    </div>

    <!-- Hamburger móvil -->
    <button class="nav-hamburger" (click)="menuOpen=!menuOpen">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- Mobile menu -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <a (click)="scrollTo('inicio'); menuOpen=false" [routerLink]="['/home']">Inicio</a>
    <a (click)="scrollTo('servicios'); menuOpen=false" [routerLink]="['/home']">Servicios</a>
    <a (click)="scrollTo('sobre'); menuOpen=false" [routerLink]="['/home']">Sobre</a>
    <a (click)="scrollTo('contacto'); menuOpen=false" [routerLink]="['/home']">Contacto</a>
    <a (click)="scrollTo('horarios'); menuOpen=false" [routerLink]="['/home']">Horarios</a>
    <hr />
    <a routerLink="/login" (click)="menuOpen=false" *ngIf="!isLoggedIn">Iniciar sesión</a>
    <a routerLink="/registro" (click)="menuOpen=false" class="nav-btn-gold-mobile" *ngIf="!isLoggedIn">Regístrate</a>
    <a routerLink="/mi-area" (click)="menuOpen=false" *ngIf="isPatient">Mi área</a>
    <a routerLink="/admin" (click)="menuOpen=false" *ngIf="isAdmin">Panel admin</a>
  </div>
</nav>

<main id="main-app-content">
  <router-outlet></router-outlet>
</main>

<footer class="text-center mt-5 mb-3">
  <a routerLink="/admin-login" style="font-size: 0.85em; color: #bbb; text-decoration: underline;">Acceso administración</a>
</footer>

<style>
  html, body { overflow-x: hidden !important; max-width: 100vw !important; margin: 0; padding: 0; background: #f8fafc; }
  * { box-sizing: border-box; }

  .main-navbar {
    width: 100vw; background: #fffbe7;
    border-bottom: 1px solid #e5e7eb;
    padding: .65rem 0;
    position: sticky; top: 0; z-index: 100;
    transition: box-shadow .2s;
  }
  .main-navbar.scrolled { box-shadow: 0 4px 20px rgba(191,160,70,.12); }

  .navbar-content {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.5rem; gap: 1rem;
  }
  .navbar-brand {
    font-size: 1.45rem; font-weight: 900; color: #bfa046;
    letter-spacing: 2px; text-decoration: none; flex-shrink: 0;
  }
  .navbar-links {
    list-style: none; display: flex; gap: 2rem; margin: 0; padding: 0; flex: 1; justify-content: center;
  }
  .navbar-links li a {
    text-decoration: none; color: #232946; font-weight: 600; font-size: 1rem;
    cursor: pointer; border-bottom: 2px solid transparent; padding-bottom: 2px;
    transition: color .15s, border-color .15s;
  }
  .navbar-links li a:hover { color: #bfa046; border-bottom-color: #bfa046; }

  .navbar-auth { display: flex; gap: .6rem; align-items: center; flex-shrink: 0; }
  .nav-btn { padding: 7px 16px; border-radius: 8px; font-weight: 700; font-size: .88rem; text-decoration: none; transition: all .15s; }
  .nav-btn-ghost { border: 1.5px solid #bfa046; color: #bfa046; background: transparent; }
  .nav-btn-ghost:hover { background: #fffbe7; }
  .nav-btn-gold { background: linear-gradient(135deg, #bfa046, #d4b660); color: #fff; border: none; }
  .nav-btn-gold:hover { opacity: .9; }

  .nav-hamburger { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px; }
  .nav-hamburger span { display: block; width: 22px; height: 2px; background: #232946; border-radius: 2px; }

  .mobile-menu {
    display: none; flex-direction: column; background: #fffbe7;
    border-top: 1px solid #e5e7eb; padding: .5rem 1.5rem 1rem;
    gap: .2rem;
  }
  .mobile-menu.open { display: flex; }
  .mobile-menu a { padding: .6rem 0; color: #232946; text-decoration: none; font-weight: 600; font-size: 1rem; border-bottom: 1px solid #f0e8c0; cursor: pointer; }
  .mobile-menu hr { border: none; border-top: 1px solid #e5e7eb; margin: .4rem 0; }
  .nav-btn-gold-mobile { color: #bfa046 !important; }

  #main-app-content { min-height: 80vh; width: 100%; }

  @media (max-width: 900px) {
    .navbar-links { display: none; }
    .navbar-auth { display: none; }
    .nav-hamburger { display: flex; }
  }
</style>

<script>
// Scroll suave a sección dentro de /home
window.devesanScrollTo = function(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
};
</script>
